[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc"
version = "0.1.0"
description = "Deterministic trading bot for Polymarket 5-minute BTC Up/Down markets"
# The VPS runs 3.12 (A2). Allowing >=3.12 lets development happen on 3.13 without a
# second toolchain, while refusing 3.11 where `type` statements and PEP 695 generics
# in this codebase would fail to parse at import time rather than at test time.
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # uvloop has no Windows wheel. Marking it keeps `pip install -e .` working on a
    # Windows dev box while still installing it on the Linux VPS where it is required.
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
# The Polymarket SDK is deliberately NOT a hard dependency in Phase 1. Phase 1 imports
# no network code at all, and pinning an unverified distribution name here would make
# `pip install -e .` fail and block infrastructure work on a package nobody has
# verified yet. The exact name and version get pinned during the execution phase,
# after verification, before V2 is ever enabled.
live = ["polymarket-client"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools.packages.find]
include = ["arc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF012: ClassVar annotations on mutable class attrs. The AST module-state gate in
# tests/test_infrastructure.py is the real enforcement for mutable state; RUF012 would
# additionally demand ClassVar on pydantic model config dicts where it is wrong.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct long literal tables and assert on them.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
# Phase 1 has no third-party stubs to chase beyond pydantic, which ships its own.
ignore_missing_imports = true
